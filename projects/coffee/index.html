  /* 独立池子：短词（加权随机）+ 长句（洗牌轮转，每条都出现、不连续重复） */
  var SHORT = DANMAKU.filter(function (d) { return d.t.length <= 6; });
  var LONG = DANMAKU.filter(function (d) { return d.t.length > 6; });
  var shortTotal = 0;
  SHORT.forEach(function (d) { shortTotal += d.w; });
  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  var longDeck = shuffle(LONG);
  var longPos = 0;
  function pickShort() {
    var r = Math.random() * shortTotal, acc = 0;
    for (var i = 0; i < SHORT.length; i++) {
      acc += SHORT[i].w;
      if (r <= acc) return SHORT[i];
    }
    return SHORT[0];
  }
  function pickLong() {
    var d = longDeck[longPos];
    longPos = (longPos + 1) % longDeck.length;
    if (longPos === 0) longDeck = shuffle(longDeck);
    return d;
  }
  var box = document.getElementById("danmakuBg");
  if (box) {
    var maxW = DANMAKU.reduce(function (a, d) { return d.w > a ? d.w : a; }, 0);
    function spawnItem(pickFn, forceLong) {
      if (!box.isConnected || box.children.length > 90) return;
      var d = pickFn();
      var span = document.createElement("span");
      span.textContent = d.t;
      var isLong = forceLong || d.t.length > 6;
      var size = isLong ? 20 + Math.random() * 16 : 18 + (d.w / maxW) * 30 + Math.random() * 8;
      span.style.fontSize = size.toFixed(1) + "px";
      span.style.color = d.c;
      span.style.left = (2 + Math.random() * 92).toFixed(1) + "%";
      span.style.top = (2 + Math.random() * 88).toFixed(1) + "%";
      /* 入场起始随机（下限 0.6）；终点随机（增速差异化）；淡出起点三档随机 */
      span.style.setProperty("--s0", (0.6 + Math.random() * 0.6).toFixed(2));
      span.style.setProperty("--s1", (2.0 + Math.random() * 1.0).toFixed(2));
      span.style.animationName = "bubble-" + ["a", "b", "c"][Math.floor(Math.random() * 3)];
      span.style.animationDuration = (3 + Math.random() * 5).toFixed(1) + "s";
      /* 原地冒泡：随机位置浮现 → 轻微放大 → 淡出移除 */
      span.addEventListener("animationend", function () { span.remove(); });
      box.appendChild(span);
    }
    /* 初始：短词连发快速填满 + 长句先出几条 */
    for (var i = 0; i < 20; i++) setTimeout(function () { spawnItem(pickShort, false); }, i * 110);
    for (var j = 0; j < 4; j++) setTimeout(function () { spawnItem(pickLong, true); }, 400 + j * 900);
    /* 双池独立节奏：短词高频、长句低频轮转 */
    setInterval(function () { spawnItem(pickShort, false); }, 180);
    setInterval(function () { spawnItem(pickLong, true); }, 2200);
  }
})();
