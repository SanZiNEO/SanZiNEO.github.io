<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短视频视域下鲁豫文旅品牌数字化传播效能研究 · SanZiNEO 作品集</title>
<meta name="description" content="鲁豫 4 个官方文旅账号抖音传播效能对比：6040 视频样本、17.7 万评论。">
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="../../index.html">SanZiNEO</a>
  <div class="nav-links">
    <a href="../../index.html#projects">项目</a>
    <a href="https://github.com/SanZiNEO" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</nav>

<header class="proj-hero">
  <div class="proj-hero-left" style="grid-column:1">
    <div class="crumbs reveal"><a href="../../index.html">首页</a> / 文旅传播研究</div>
    <h1 class="proj-hero-title reveal" style="--d:.05s">鲁豫文旅品牌数字化<br>传播效能研究</h1>
    <p class="proj-hero-desc reveal" style="--d:.1s">
      省级文旅账号的传播力是市级的 5–10 倍。
    </p>
    <div class="proj-hero-nums reveal" style="--d:.15s">
      <div class="proj-hero-num"><b data-count="6040">0</b><span>视频样本</span></div>
      <div class="proj-hero-num"><b data-count="17.7" data-decimals="1" data-suffix="万">0</b><span>评论</span></div>
      <div class="proj-hero-num"><b data-count="85.75" data-decimals="2" data-suffix="%">0</b><span>情感分析准确率</span></div>
    </div>
  </div>
  <div class="proj-hero-visual reveal" style="--d:.12s;grid-column:2">
    <div class="chart-title" style="font-size:17px">月评论量对比（2024.11 – 2025.07）</div>
    <div class="chart-body" id="timeline" style="margin-top:8px"></div>
  </div>
</header>

<main class="container">

  <section class="section" style="padding-top:24px">
    <div class="wide-charts">
      <div class="chart-card reveal">
        <div class="chart-title">视频平均互动（点赞 / 转发）</div>
        <div class="chart-body" id="interactBar"></div>
      </div>
      <div class="chart-card reveal">
        <div class="chart-title">评论 IP 地域 Top 9（全部账号）</div>
        <div class="chart-body" id="ipBar"></div>
      </div>
      <div class="chart-card reveal">
        <div class="chart-title">各账号本省用户评论占比</div>
        <div class="chart-body" id="homeBar"></div>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container footer-inner">
    <p>© 2026 SanZiNEO · 作品集</p>
    <p><a href="https://github.com/SanZiNEO" target="_blank" rel="noopener">github.com/SanZiNEO ↗</a></p>
  </div>
</footer>

<script src="../../assets/js/chart.js"></script>
<script src="../../assets/js/common.js"></script>
<script>
Chart.line(document.getElementById("timeline"), {
  labels: ["2024-11","2024-12","2025-01","2025-02","2025-03","2025-04","2025-05","2025-06","2025-07"],
  series: [
    { name: "河南省文旅厅", values: [7005,6505,6724,4475,5580,4927,5064,5913,4571], color: "#38bdf8" },
    { name: "好客山东", values: [7361,9984,7257,7863,8698,4226,3084,3981,3754], color: "#34d399" },
    { name: "洛阳旅游", values: [511,958,840,518,800,1057,689,462,365], color: "#fbbf24" },
    { name: "威海文旅", values: [175,611,819,599,841,1002,491,423,273], color: "#f472b6" }
  ],
  area: false,
  clean: true,
  height: 380
});
Chart.bar(document.getElementById("interactBar"), {
  labels: ["河南省文旅厅", "好客山东", "洛阳旅游", "威海文旅"],
  series: [
    { name: "平均点赞", values: [7015, 6966, 3567, 1596], color: "#38bdf8" },
    { name: "平均转发", values: [2479, 3050, 474, 140], color: "#a78bfa" }
  ],
  clean: true,
  height: 230
});
Chart.hbar(document.getElementById("ipBar"), {
  labels: ["河南", "山东", "广东", "江苏", "浙江", "北京", "河北", "陕西", "上海"],
  values: [45616, 37473, 9918, 7576, 5897, 5159, 4434, 4034, 3978],
  colors: ["#38bdf8", "#38bdf8", "#a78bfa", "#a78bfa", "#a78bfa", "#a78bfa", "#a78bfa", "#a78bfa", "#a78bfa"],
  clean: true,
  height: 300
});
Chart.hbar(document.getElementById("homeBar"), {
  labels: ["河南省文旅厅（豫）", "好客山东（鲁）", "威海文旅（鲁）", "洛阳旅游（豫）"],
  values: [49.0, 47.0, 41.0, 33.0],
  unit: "%",
  clean: true,
  height: 200
});
</script>
</body>
</html>
