<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汽车品牌社交媒体用户画像与消费者洞察研究 · SanZiNEO 作品集</title>
<meta name="description" content="20 个汽车品牌微博消费者画像：7 大维度画像体系 + 10 大兴趣领域渗透模型。">
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="../../index.html">SanZiNEO</a>
  <div class="nav-links">
    <a href="../../index.html#projects">项目</a>
    <a href="https://github.com/SanZiNEO" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</nav>

<header class="proj-hero">
  <div class="proj-hero-left" style="grid-column:1">
    <div class="crumbs reveal"><a href="../../index.html">首页</a> / 汽车画像</div>
    <h1 class="proj-hero-title reveal" style="--d:.05s">汽车品牌社交媒体<br>用户画像与消费者洞察</h1>
    <p class="proj-hero-desc reveal" style="--d:.1s">
      20 个汽车品牌的消费者画像研究——兴趣渗透、性别结构、核心用户。
    </p>
    <div class="proj-hero-nums reveal" style="--d:.15s">
      <div class="proj-hero-num"><b data-count="20">0</b><span>汽车品牌</span></div>
      <div class="proj-hero-num"><b data-count="7292">0</b><span>评论用户</span></div>
      <div class="proj-hero-num"><b data-count="110" data-suffix="万+">0</b><span>关注关系</span></div>
    </div>
    <div class="brand-picker reveal" id="brandPicker" style="--d:.2s;margin-top:14px"></div>
    <select class="brand-select reveal" id="brandSelect" style="--d:.24s;margin-top:10px" aria-label="选择品牌">
      <option value="">+ 添加品牌…</option>
    </select>
  </div>
  <div class="proj-hero-visual reveal" style="--d:.12s;grid-column:2">
    <div class="tab-bar" id="chartTabs">
      <button class="tab-btn on" type="button" data-tab="radar">兴趣渗透</button>
      <button class="tab-btn" type="button" data-tab="gender">性别结构</button>
      <button class="tab-btn" type="button" data-tab="core">核心用户</button>
    </div>
    <div class="big-chart on" id="bigRadar"></div>
    <div class="big-chart" id="bigGender"><div class="chart-title" style="text-align:center">男性用户占比</div></div>
    <div class="big-chart" id="bigCore"><div class="chart-title" style="text-align:center">核心用户占比</div></div>
  </div>
</header>

<main class="container">

  <section class="section" style="padding-top:8px">
    <div class="section-head reveal">
      <div class="section-kicker">Value</div>
      <h2 class="section-title">20 品牌核心用户占比排行</h2>
    </div>
    <div class="chart-card reveal">
      <div class="chart-body" id="coreRank"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container footer-inner">
    <p>© 2026 SanZiNEO · 作品集</p>
    <p><a href="https://github.com/SanZiNEO" target="_blank" rel="noopener">github.com/SanZiNEO ↗</a></p>
  </div>
</footer>

<script src="../../assets/js/chart.js"></script>
<script src="../../assets/js/data-auto.js"></script>
<script src="../../assets/js/data-auto2.js"></script>
<script src="../../assets/js/common.js"></script>
<script>
var AD = window.AUTO_DATA;
var ST = window.AUTO_STATS;
var palette = ["#7FA5B8", "#BEA0C8", "#D19B9B", "#8EB5AD", "#DBC094", "#CF9292", "#8FB4C4"];
var statOf = {};
ST.forEach(function (s) { statOf[s.name] = s; });
var colorOf = {};
AD.brands.forEach(function (b, i) { colorOf[b.name] = palette[i % palette.length]; });

var activeSet = new Set(["特斯拉", "比亚迪汽车", "小米汽车", "理想汽车"]);
var current = "radar";
function activeNames() { return Array.from(activeSet); }

/* 20 品牌市场平均 */
function avgOf(key) { return +(ST.reduce(function (a, s) { return a + s[key]; }, 0) / ST.length).toFixed(1); }
var AVG = {
  malePct: avgOf("malePct"), corePct: avgOf("corePct"),
  posPct: avgOf("posPct"), negPct: avgOf("negPct"),
  officialPct: avgOf("officialPct"), kolPct: avgOf("kolPct"), amateurPct: avgOf("amateurPct")
};
var AVG_NEUTRAL = +(100 - AVG.posPct - AVG.negPct).toFixed(1);

/* ---- 雷达 ---- */
var radar = Chart.radarCompare(document.getElementById("bigRadar"), {
  labels: AD.domains,
  base: AD.avg.map(function (v) { return v / 100; }),
  brands: AD.brands.map(function (b, i) {
    return { name: b.name, values: b.values.map(function (v) { return v / 100; }), color: colorOf[b.name] };
  }),
  active: activeNames(),
  width: 800,
  height: 560
});

/* ---- 其他维度图（动态品牌 + 市场平均参照） ---- */
var gender = Chart.bar(document.getElementById("bigGender"), {
  labels: activeNames(),
  series: [{ name: "男性占比 %", values: activeNames().map(function (n) { return statOf[n].malePct; }), color: "#7FA5B8" }],
  baseline: { value: AVG.malePct, label: "市场平均 " + AVG.malePct + "%" },
  clean: true, height: 420
});
var core = Chart.bar(document.getElementById("bigCore"), {
  labels: activeNames(),
  series: [{ name: "核心用户占比 %", values: activeNames().map(function (n) { return statOf[n].corePct; }), color: "#BEA0C8" }],
  baseline: { value: AVG.corePct, label: "市场平均 " + AVG.corePct + "%" },
  clean: true, height: 420
});

function refreshCurrent() {
  var names = activeNames();
  if (current === "radar") radar.update(names);
  else if (current === "gender") gender.update(names, [{ name: "男性占比 %", values: names.map(function (n) { return statOf[n].malePct; }), color: "#7FA5B8" }]);
  else if (current === "core") core.update(names, [{ name: "核心用户占比 %", values: names.map(function (n) { return statOf[n].corePct; }), color: "#BEA0C8" }]);
}

/* 20 品牌核心用户占比排行（降序，前三高亮） */
(function () {
  var sorted = ST.slice().sort(function (a, b) { return b.corePct - a.corePct; });
  Chart.hbar(document.getElementById("coreRank"), {
    labels: sorted.map(function (s) { return s.name; }),
    values: sorted.map(function (s) { return s.corePct; }),
    unit: "%",
    colors: sorted.map(function (s, i) { return i < 3 ? "#7FA5B8" : "#8C8C8E"; }),
    clean: true,
    height: 560
  });
})();

/* ---- 品牌选择 ---- */
var picker = document.getElementById("brandPicker");
var select = document.getElementById("brandSelect");
var featured = ["特斯拉", "比亚迪汽车", "小米汽车", "理想汽车", "吉利汽车", "奥迪", "大众汽车", "鸿蒙智行"];
var chipEls = {};
AD.brands.forEach(function (b) {
  var chip = document.createElement("button");
  chip.type = "button";
  chip.className = "brand-chip" + (activeSet.has(b.name) ? " on" : "");
  chip.textContent = b.name;
  chip.addEventListener("click", function () {
    if (activeSet.has(b.name)) { activeSet.delete(b.name); chip.classList.remove("on"); }
    else { activeSet.add(b.name); chip.classList.add("on"); }
    refreshCurrent();
  });
  chipEls[b.name] = chip;
  if (featured.indexOf(b.name) >= 0) picker.appendChild(chip);
  var opt = document.createElement("option");
  opt.value = b.name;
  opt.textContent = b.name;
  select.appendChild(opt);
});
select.addEventListener("change", function () {
  var nm = select.value;
  if (nm && !activeSet.has(nm)) {
    activeSet.add(nm);
    refreshCurrent();
    if (chipEls[nm]) chipEls[nm].classList.add("on");
    if (chipEls[nm].parentElement !== picker) picker.appendChild(chipEls[nm]);
  }
  select.value = "";
});

/* ---- 标签卡切换 ---- */
var tabs = document.getElementById("chartTabs");
var bigs = { radar: document.getElementById("bigRadar"), gender: document.getElementById("bigGender"), core: document.getElementById("bigCore") };
tabs.addEventListener("click", function (e) {
  var btn = e.target.closest(".tab-btn");
  if (!btn) return;
  Array.prototype.forEach.call(tabs.children, function (b) { b.classList.remove("on"); });
  btn.classList.add("on");
  current = btn.getAttribute("data-tab");
  Object.keys(bigs).forEach(function (k) { bigs[k].classList.toggle("on", k === current); });
  refreshCurrent();
});
</script>
</body>
</html>
